# Copy to inventory.yml. Primaries: ISPConfig DNS servers with the dns-catalog server tool installed
# (ispconfig-rest server-tools install --components dns-catalog). Secondaries: Debian/Ubuntu hosts with BIND 9.18+.
all:
  children:
    ispconfig_dns_primaries:
      hosts:
        ns1.example.com:
          # Addresses the secondaries transfer from (default: the host's IPv4 address)
          # ispcp_primary_addresses: [203.0.113.10, "2001:db8::10"]
    ispconfig_dns_secondaries:
      hosts:
        ns2.example.net:
          # Addresses the primaries notify of catalog changes (default: the host's IPv4 address)
          # ispcp_secondary_addresses: [198.51.100.20]
