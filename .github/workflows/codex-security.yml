name: Codex Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: codex-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Never execute a fork's checkout with the scan credential, including via
    # pull_request_target or workflow_run. Full scans use local ChatGPT sign-in.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SCAN_SCOPE: diff
      SCAN_MAX_COST: ${{ vars.CODEX_SECURITY_PR_MAX_COST || '5' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check scan credentials
        id: credentials
        env:
          HAS_SCAN_KEY: ${{ secrets.CODEX_SECURITY_API_KEY != '' }}
        run: |
          if [ "$HAS_SCAN_KEY" != true ]; then
            echo '::notice::PR scan skipped: CODEX_SECURITY_API_KEY is not configured. Use the local subscription runner.'
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Codex Security $SCAN_SCOPE scan; estimated cost stop threshold USD $SCAN_MAX_COST (not a hard spending cap)."
      - name: Set up the Ubuntu sandbox
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Check out the scan revision
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan ${{ env.SCAN_SCOPE }} (USD ${{ env.SCAN_MAX_COST }} estimated limit)
        id: security
        if: steps.credentials.outputs.enabled == 'true'
        uses: openai/codex-security@3f61e5150981a5087c32e4395bbaa8ce5ce0c3e3 # action-v0.3.0
        with:
          scope: ${{ env.SCAN_SCOPE }}
          model: ${{ vars.CODEX_SECURITY_MODEL || 'gpt-6-sol' }}
          effort: high
          max-cost: ${{ env.SCAN_MAX_COST }}
          fail-on-severity: none
          # Public Actions logs/artifacts must not disclose untriaged findings.
          verbose: 'false'
          summary: 'false'
          annotations: 'false'
          upload-artifacts: 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
      - name: Upload security findings
        if: ${{ always() && steps.security.outputs.sarif-upload-ready == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.security.outputs.sarif-path }}
          sha: ${{ steps.security.outputs.scanned-sha }}
          ref: ${{ steps.security.outputs.analysis-ref }}
          category: codex-security-pr
