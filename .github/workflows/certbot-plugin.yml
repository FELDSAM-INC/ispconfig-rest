# Publishes the certbot plugin acme-dns/certbot to PyPI as certbot-dns-ispconfig-rest, through PyPI's trusted
# publishing (no stored token): push a tag certbot-dns-ispconfig-rest-vX.Y.Z matching its pyproject.toml version.
name: certbot plugin

on:
  push:
    tags: ['certbot-dns-ispconfig-rest-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check
        working-directory: acme-dns/certbot
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$TAG" = "certbot-dns-ispconfig-rest-v$version" ] || { echo "Tag $TAG does not match version $version"; exit 1; }
          pip install --quiet build twine
          python -m build --sdist --wheel --outdir dist .
          twine check --strict dist/*
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/certbot plugins --text 2>/dev/null | grep -q '^\* dns-ispconfig-rest$'
          cd tests && /tmp/venv/bin/python -m unittest test_dns_ispconfig_rest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: acme-dns/certbot/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/certbot-dns-ispconfig-rest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
