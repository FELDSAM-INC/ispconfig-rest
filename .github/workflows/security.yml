name: Security checks

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [secrets, source]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scanner failure and reporting behavior
        run: python3 -m unittest discover -s scripts/security -p '*_test.py'
      - name: Run pinned scanners
        run: python3 scripts/security/check.py "${{ matrix.check }}"
      - name: Retain standard scanner reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-${{ matrix.check }}
          path: security-reports/
          retention-days: 7
          if-no-files-found: ignore

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit all locked dependencies, including development tools
        run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges -u "$(id -u):$(id -g)" -v "$PWD:/app:ro" -w /app composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc audit --locked --no-plugins --no-scripts --no-interaction

  php-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      API_EXTENSIONS_PATH: /nonexistent/ispconfig-rest-extensions
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, openssl, tokenizer, xml, ctype, bcmath, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress --no-plugins
      - name: Check the entire application at PHPStan level 1
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Check authentication and authorization at PHPStan level 5
        run: vendor/bin/phpstan analyse -c phpstan-security.neon --no-progress --memory-limit=1G
      - name: Exercise real HTTP authentication and tenant boundaries with disposable SQLite
        run: python3 scripts/security/runtime.py

  local-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify local subscription runner without model calls
        run: node --test scripts/security/scan-local.test.mjs
