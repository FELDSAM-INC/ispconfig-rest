# Draft of api/modules/changes/changes.yaml (spec 015).
# Module index api/modules/changes/_index.yaml:
#   changes:
#     $ref: './changes.yaml'
# Register in api/openapi.yaml paths:
#   /changes:                  $ref: './modules/changes/changes.yaml#/~1changes'
#   /changes/{change_set_id}:  $ref: './modules/changes/changes.yaml#/~1changes~1{change_set_id}'
# and components:
#   schemas:  Change, ChangeSet
#   headers:  ChangeSetId -> './components/headers/ChangeSetId.yaml'  (new components section)

/changes:
  get:
    tags:
      - Changes
    summary: List changes and their processing status
    description: |
      Journal entries (`sys_datalog`) with their processing status, newest first by default.

      - **Non-admin keys** see entries written by their own ISPConfig identity. When `table` and
        `record_id` are given, they see entries of that record from any writer, provided the key can
        read the record (404 otherwise).
      - **Admin keys** see all entries.

      Journal payloads, writer usernames and server ids are never returned; administrators read
      payloads through `/monitor/data-logs`.

      Status: `pending` until every responsible active server (target server and its mirrors, or all
      active servers for server-independent entries) has processed the entry; `failed` when processed
      with an error recorded by ISPConfig; `stalled` when no active server is responsible;
      `applied` otherwise.
    parameters:
      - $ref: '../../components/parameters/limit.yaml'
      - $ref: '../../components/parameters/offset.yaml'
      - name: order
        in: query
        description: Sort direction by journal id (newest first by default).
        required: false
        schema:
          type: string
          enum:
            - asc
            - desc
          default: desc
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - pending
            - applied
            - failed
            - stalled
      - name: table
        in: query
        description: ISPConfig table name, for example `web_domain`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: record_id
        in: query
        description: |
          Primary key of one record. Requires `table`, and `table` must be a table exposed as an API
          resource (400 otherwise). Switches non-admin keys to the record view described above.
        required: false
        schema:
          type: integer
          minimum: 1
      - name: change_set_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: since
        in: query
        description: Only entries journaled at or after this time.
        required: false
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: Changes visible to the key
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/Change.yaml'
                meta:
                  $ref: '../../components/schemas/Meta.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

/changes/{change_set_id}:
  get:
    tags:
      - Changes
    summary: Get the status of one change set
    description: |
      Aggregate status and entries of all journal entries written by one request, identified by the
      `X-Change-Set-Id` header of that request's response. Poll until the status is no longer
      `pending`. Returns 404 when the set does not exist, is not visible to the key, or was purged by
      ISPConfig's log cleanup after being processed.
    parameters:
      - name: change_set_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9,-]{1,64}$'
    responses:
      '200':
        description: Change set status
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/ChangeSet.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'
