# Additional PHP versions of this server in ISPConfig (System > Additional PHP Versions), as the autoinstaller adds
# them: in the master database, then copied with their IDs into the server's own database, which websites use.
- name: Add the PHP versions to the master database
  ansible.builtin.command:
    cmd: mysql --defaults-file=/etc/mysql/debian.cnf --batch --skip-column-names dbispconfig
    stdin: |
      INSERT INTO server_php (sys_userid, sys_groupid, sys_perm_user, sys_perm_group, sys_perm_other, server_id, client_id, name, php_fastcgi_binary, php_fastcgi_ini_dir, php_fpm_init_script, php_fpm_ini_dir, php_fpm_pool_dir, php_fpm_socket_dir, php_cli_binary, php_jk_section, active, sortprio)
      SELECT 1, 1, 'riud', 'riud', '', {{ ispconfig_server_id.stdout }}, 0, '{{ item.name }}', '{{ item.php_fastcgi_binary }}', '{{ item.php_fastcgi_ini_dir }}', '{{ item.php_fpm_init_script }}', '{{ item.php_fpm_ini_dir }}', '{{ item.php_fpm_pool_dir }}', '{{ item.php_fpm_socket_dir }}', '{{ item.php_cli_binary }}', '{{ item.php_jk_section }}', 'y', 0
      FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM server_php WHERE server_id = {{ ispconfig_server_id.stdout }} AND name = '{{ item.name }}');
      SELECT ROW_COUNT();
  delegate_to: "{{ ispconfig_master }}"
  loop: "{{ ispconfig_server_php }}"
  loop_control:
    label: "{{ item.name }}"
  register: ispconfig_server_php_added
  changed_when: ispconfig_server_php_added.stdout | trim != '0'

- name: Copy them to the server's own database
  when: ispconfig_master != inventory_hostname and ispconfig_server_php_added is changed
  block:
    - name: Read the PHP versions of this server from the master database
      ansible.builtin.command: >-
        mysqldump --defaults-file=/etc/mysql/debian.cnf --single-transaction --skip-triggers --no-create-info
        --skip-add-locks --skip-comments --compact --replace dbispconfig server_php
        --where=server_id={{ ispconfig_server_id.stdout }}
      delegate_to: "{{ ispconfig_master }}"
      register: ispconfig_server_php_rows
      changed_when: false

    - name: Write them to the server's own database
      ansible.builtin.command:
        cmd: mysql --defaults-file=/etc/mysql/debian.cnf dbispconfig
        stdin: "{{ ispconfig_server_php_rows.stdout }}"
