# PHP versions, FTP passive ports, jailkit and quota are set with the ispconfig_server variables
# (ispconfig_php_versions, ispconfig_ftp_passive_ports, ...): the autoinstaller applies them.

# PHP 5.3 is built from source (files/build-php53.sh) when ispconfig_php_versions lists it. It runs as PHP-FPM only.
# The sources are pinned: PHP 5.3.29 (php.net), OpenSSL 1.0.2u and curl 7.88.1 (signed by its maintainer).
ispconfig_php53_prefix: /opt/php-5.3
ispconfig_php53_config_dir: /etc/php/5.3
ispconfig_php53_sources:
  php:
    url: https://www.php.net/distributions/php-5.3.29.tar.xz
    sha256: 8438c2f14ab8f3d6cd2495aa37de7b559e33b610f9ab264f0c61b531bf0c262d
  openssl:
    url: https://github.com/openssl/openssl/releases/download/OpenSSL_1_0_2u/openssl-1.0.2u.tar.gz
    sha256: ecd0c6ffb493dd06707d38b14bb4d8c2288bb7033735606569d8f90f89669d16
  curl:
    url: https://curl.se/download/curl-7.88.1.tar.xz
    sha256: 1dae31b2a7c1fe269de99c0c31bb488346aab3459b5ffca909d6938249ae415f
ispconfig_php53_build_packages:
  - build-essential
  - pkg-config
  - perl
  - curl
  - ca-certificates
  - xz-utils
  - dpkg-dev
  - libxml2-dev
  - libbz2-dev
  - libjpeg-dev
  - libpng-dev
  - libfreetype-dev
  - libxslt1-dev
  - zlib1g-dev
  - libmcrypt-dev
  - libltdl-dev
# php.ini settings for PHP 5.3 (CLI and FPM), besides php.ini-production and the server's time zone.
ispconfig_php53_ini: {}
ispconfig_php53_build_timeout: 3600
