# Variables of the ISPConfig autoinstaller run. The autoinstaller runs once per server, with the services of all its
# groups (ispconfig_panel, ispconfig_web, ispconfig_db, ispconfig_dns), so these apply to every role.

# Identity. The FQDN becomes the ISPConfig server name; the address is the one the other ISPConfig servers use
# (MariaDB of the panel, /etc/hosts). Set ispconfig_address per host when the default IPv4 address is not that one.
ispconfig_hostname: "{{ inventory_hostname }}"
# ispconfig_address: 10.0.0.11
ispconfig_set_hostname: true
ispconfig_manage_hosts_file: true

# Autoinstaller (https://www.ispconfig.org/documentation/installing-ispconfig-with-the-autoinstaller/). It is not
# versioned; pin the SHA-256 of a reviewed copy to fail instead of installing a changed one.
ispconfig_autoinstaller_url: https://www.ispconfig.org/downloads/ispconfig-ai.tar.gz
ispconfig_autoinstaller_sha256: ""
ispconfig_channel: stable
ispconfig_language: en
ispconfig_webserver: nginx
ispconfig_firewall: true
# Local caching BIND on servers that serve no DNS zones (the autoinstaller installs it for mail filtering).
ispconfig_local_dns: false
# Further autoinstaller options, e.g. ["--monit", "--unattended-upgrades=autoclean", "--ssh-harden"].
ispconfig_autoinstaller_args: []
# Self-signed certificate fields used until Let's Encrypt can issue one: country, state, locality, organisation,
# organisation_unit, email.
ispconfig_ssl_cert: {}
# Seconds the autoinstaller may run.
ispconfig_autoinstaller_timeout: 7200

# PHP CLI 8.3+ is needed by ispconfig-rest and its server tools; every server gets it, and it becomes the default
# `php` where the system's PHP is older (Debian 12).
ispconfig_tools_php_version: "8.3"

# Web servers: PHP versions for websites. 5.6 and 7.0-8.5 come from the sury repository, 5.3 is built from source
# (PHP-FPM only). Remove versions you do not offer.
ispconfig_php_versions: ["5.3", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
ispconfig_ftp_passive_ports: "40110-40210"
ispconfig_jailkit: true
ispconfig_quota: true
# phpMyAdmin on the panel (it reaches the panel's own MariaDB).
ispconfig_phpmyadmin: true

# The panel's ISPConfig interface.
ispconfig_admin_password: ""
ispconfig_interface_port: 8080

# MariaDB account on the panel that servers use to join it and that ISPConfig updates on those servers ask for
# ("MySQL master server root"). It is created for each server's address only.
ispconfig_master_db_admin_user: ispconfig_join
ispconfig_master_db_admin_password: ""
ispconfig_master_db_port: 3306
# Where MariaDB listens. Database servers: all addresses, for the web servers and for customers' remote access
# (ISPConfig grants each database user to its allowed addresses). The panel: loopback and ispconfig_address only, so
# the master database is reachable from the private network, not from the internet (MariaDB before 10.11 takes one
# address: ispconfig_address, local clients use the socket). Web and DNS servers: loopback only.
ispconfig_mariadb_bind_address: >-
  {{ '0.0.0.0' if 'db' in ispconfig_services
     else (('127.0.0.1,' ~ ispconfig_ip) if ispconfig_mariadb_version is version('10.11', '>=') else ispconfig_ip)
       if 'panel' in ispconfig_services
     else '127.0.0.1' }}

ispconfig_supported_os:
  - Debian 12
  - Debian 13
  - Ubuntu 22.04
  - Ubuntu 24.04
