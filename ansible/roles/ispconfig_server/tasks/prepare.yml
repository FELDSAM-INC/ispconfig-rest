# Runs on every ISPConfig server first: services from the inventory groups, checks, host name and /etc/hosts. The
# facts set here are used by all roles, also for the other servers (hostvars).
- name: Check the operating system
  ansible.builtin.assert:
    that: ispconfig_os in ispconfig_supported_os
    fail_msg: "{{ ispconfig_os }} is not supported; use one of {{ ispconfig_supported_os | join(', ') }}."
    quiet: true
  vars:
    ispconfig_os: "{{ ansible_distribution }} {{ ansible_distribution_major_version if ansible_distribution == 'Debian' else ansible_distribution_version }}"

- name: Work out the services of this server
  ansible.builtin.set_fact:
    ispconfig_services: "{{ ispconfig_groups | dict2items | selectattr('key', 'in', group_names) | map(attribute='value') | list }}"
    ispconfig_fqdn: "{{ ispconfig_hostname | lower }}"
    ispconfig_ip: "{{ ispconfig_address | default(ansible_default_ipv4.address | default('')) }}"
    ispconfig_master: "{{ (groups['ispconfig_panel'] | default([]))[0] | default('') }}"

- name: Work out the PHP versions
  ansible.builtin.set_fact:
    ispconfig_php_tools: "{{ ispconfig_tools_php_version | string }}"
    ispconfig_httpd: "{{ ispconfig_webserver }}"
    ispconfig_php_websites: "{{ ispconfig_website_php | select('in', ispconfig_sury_php_versions) | list }}"
    ispconfig_php_sury: "{{ ((ispconfig_website_php | select('in', ispconfig_sury_php_versions) | list) + [ispconfig_tools_php_version | string]) | unique | sort }}"
    ispconfig_php_build: "{{ ispconfig_website_php | select('in', ispconfig_built_php_versions) | list }}"
  vars:
    ispconfig_website_php: "{{ (ispconfig_php_versions | map('string') | list) if 'web' in ispconfig_services else [] }}"

- name: Check the inventory and variables
  ansible.builtin.assert:
    that:
      - groups['ispconfig_panel'] | default([]) | length == 1
      - ispconfig_services | length > 0
      - ispconfig_fqdn is match('^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.){2,}[a-z]([a-z0-9-]*[a-z0-9])?$')
      - ispconfig_ip | length > 0
      - ispconfig_webserver in ['nginx', 'apache']
      - ispconfig_php_versions | map('string') | reject('in', ispconfig_sury_php_versions + ispconfig_built_php_versions) | list | length == 0
      - ispconfig_tools_php_version is version('8.3', '>=') and ispconfig_tools_php_version in ispconfig_sury_php_versions
      - ispconfig_ftp_passive_ports == '' or ispconfig_ftp_passive_ports is match('^[1-9][0-9]*-[1-9][0-9]*$')
      - "'panel' not in ispconfig_services or ispconfig_admin_password | length >= 8"
      - ispconfig_master_db_admin_password | length >= 16 or groups['ispconfig_panel'] | length == ispconfig_all_servers | length
      - ispconfig_master_db_admin_user is match('^[A-Za-z0-9_]{1,32}$')
    fail_msg: >-
      Exactly one host in ispconfig_panel; every server an FQDN as inventory name (or ispconfig_hostname) and an
      address; ispconfig_admin_password (8+ characters) and, with servers besides the panel,
      ispconfig_master_db_admin_password (16+ characters); PHP versions from
      {{ (ispconfig_built_php_versions + ispconfig_sury_php_versions) | join(', ') }}.
    quiet: true
  vars:
    ispconfig_all_servers: "{{ groups['ispconfig_panel'] | default([]) + groups['ispconfig_web'] | default([]) + groups['ispconfig_db'] | default([]) + groups['ispconfig_dns'] | default([]) }}"

- name: Set the host name
  ansible.builtin.hostname:
    name: "{{ ispconfig_fqdn.split('.')[0] }}"
  when: ispconfig_set_hostname | bool

# `hostname -f` must give the FQDN, and every server must resolve the others to the addresses they connect from:
# the panel's MariaDB grants the servers' ISPConfig accounts by name and address.
- name: Remove the loopback entry of the host name
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    state: absent
  when: ispconfig_manage_hosts_file | bool

- name: List the ISPConfig servers in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ISPConfig servers (Ansible)"
    block: |
      {% for host in ansible_play_hosts_all | sort if hostvars[host].ispconfig_fqdn is defined %}
      {{ hostvars[host].ispconfig_ip }} {{ hostvars[host].ispconfig_fqdn }} {{ hostvars[host].ispconfig_fqdn.split('.')[0] }}
      {% endfor %}
  when: ispconfig_manage_hosts_file | bool

- name: Check the FQDN
  ansible.builtin.command: hostname -f
  register: ispconfig_hostname_check
  changed_when: false
  failed_when: ispconfig_hostname_check.stdout | trim | lower != ispconfig_fqdn
