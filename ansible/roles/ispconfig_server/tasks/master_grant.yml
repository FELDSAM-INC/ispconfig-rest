# On the panel: the MariaDB account a server uses to join the master database, for the server's address only.
# ISPConfig asks for it again when it updates that server ("MySQL master server root"). The password travels as
# base64 and MariaDB quotes it itself (QUOTE), so no character of it needs escaping here.
- name: Allow this server to join the panel's database
  ansible.builtin.command:
    cmd: mysql --defaults-file=/etc/mysql/debian.cnf --batch --skip-column-names
    stdin: |
      SELECT COUNT(*) FROM mysql.user WHERE User = '{{ ispconfig_master_db_admin_user }}' AND Host = '{{ ispconfig_ip }}';
      SET @ispconfig_password = QUOTE(FROM_BASE64('{{ ispconfig_master_db_admin_password | b64encode }}'));
      {% for statement in ['CREATE USER IF NOT EXISTS', 'ALTER USER'] %}
      SET @ispconfig_sql = CONCAT('{{ statement }} ''{{ ispconfig_master_db_admin_user }}''@''{{ ispconfig_ip }}'' IDENTIFIED BY ', @ispconfig_password);
      PREPARE ispconfig_statement FROM @ispconfig_sql;
      EXECUTE ispconfig_statement;
      DEALLOCATE PREPARE ispconfig_statement;
      {% endfor %}
      GRANT ALL PRIVILEGES ON *.* TO '{{ ispconfig_master_db_admin_user }}'@'{{ ispconfig_ip }}' WITH GRANT OPTION;
  delegate_to: "{{ ispconfig_master }}"
  register: ispconfig_master_grant
  changed_when: ispconfig_master_grant.stdout_lines[0] | default('') == '0'
  no_log: true
