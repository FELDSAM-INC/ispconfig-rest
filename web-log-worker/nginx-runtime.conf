# ISPConfig REST runtime constants. geo stores literal strings, without variable expansion.
# These values are independent of the client address. Keep this file root-owned.
geo $ispcp_literal_dollar { default "$"; }
geo $ispcp_literal_open { default "{"; }
geo $ispcp_literal_close { default "}"; }
geo $ispcp_literal_less { default "<"; }
geo $ispcp_literal_greater { default ">"; }
geo $ispcp_literal_hash { default "#"; }
