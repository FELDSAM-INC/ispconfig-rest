# Installation password policy for non-mail credentials (spec 038).
# Read from the [misc] section of the sys_ini blob; installation-wide.
type: object
description: |
  The password rules this installation applies to the credentials of an account — database users, FTP, SSH, WebDAV
  and web folder users, the website statistics password and the control-panel password. A generator satisfies them
  with at least `min_length` characters and a strength of at least `min_strength`.

  Mailboxes use `mail.password_policy`, which adds the mail-only ASCII restriction.
additionalProperties: false
required:
  - min_length
  - min_strength
properties:
  min_length:
    type: integer
    minimum: 0
    description: Minimum number of characters (`min_password_length`; 8 when the installation sets none).
    example: 8
  min_strength:
    type: integer
    minimum: 0
    maximum: 5
    description: |
      Minimum strength on ISPConfig's scale — 1 weak, 2 fair, 3 good, 4 strong, 5 very strong; 0 means no strength
      requirement. The strength grows with the length and the number of character classes used (lowercase,
      uppercase, digits, symbols).
    example: 3
