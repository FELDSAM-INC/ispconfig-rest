type: object
required: [id, action, status, database_id, target_database_id, created_at, expires_at, error, upload_bytes, uploaded_bytes, download_bytes, chunk_size]
properties:
  id: {type: string, format: uuid}
  action: {type: string, enum: [import, export, copy]}
  status: {type: string, enum: [uploading, queued, running, complete, failed]}
  database_id: {type: integer}
  target_database_id: {type: integer, nullable: true}
  created_at: {type: string, format: date-time}
  expires_at: {type: string, format: date-time}
  error: {type: string, nullable: true, description: 'Generic safe failure code, never SQL or server diagnostics.'}
  upload_bytes: {type: integer, nullable: true}
  uploaded_bytes: {type: integer, minimum: 0}
  download_bytes: {type: integer, nullable: true}
  chunk_size: {type: integer, enum: [786432]}
