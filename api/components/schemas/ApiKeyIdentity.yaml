# Caller identity (spec 014) — GET /me.
# Identity and scope of the API key making the request. The local
# development key reports `key_id: null` and `name: development key`.

type: object
required:
  - key_id
  - name
  - scope
  - client_id
  - sys_userid
  - sys_groupid
  - access
  - zones
properties:
  key_id:
    type: integer
    format: int64
    nullable: true
    description: Id of the calling key; null for the local development key
    example: 17
  name:
    type: string
    description: Label of the calling key
    example: whmcs service 17
  scope:
    type: string
    enum: [admin, reseller, client]
    description: Authorization scope of the calling key
    example: client
  client_id:
    type: integer
    nullable: true
    description: Bound ISPConfig client id; null for admin keys
    example: 42
  sys_userid:
    type: integer
    description: ISPConfig user the key acts as
    example: 57
  sys_groupid:
    type: integer
    description: ISPConfig group the key acts as
    example: 61
  access:
    type: string
    enum: [full, acme]
    description: '`acme` when the calling key is limited to ACME DNS-01 challenges (spec 057)'
    example: full
  zones:
    type: array
    items:
      type: string
    description: Zones an `acme` key is limited to; empty for every zone its scope can use
    example: []
  panel_url:
    type: string
    format: uri
    nullable: true
    description: Public ISPConfig interface URL, discovered from the master's panel vhost; null when unavailable. Contains no credentials.
    example: https://panel.example.com:8080/
  services:
    type: object
    description: >-
      Whether the account has a server for each service: the lists of `GET /me/servers` are not empty (admin keys:
      the installation has an eligible server). A panel can leave out mail, for example, when it is `false`.
    required: [web, mail, db, dns]
    properties:
      web: {type: boolean}
      mail: {type: boolean}
      db: {type: boolean}
      dns: {type: boolean}
    example: {web: true, mail: false, db: true, dns: true}
