# API Key create body (spec 014) — POST /system/api-keys.
# `key`, `key_hash`, `sys_userid`, `sys_groupid`, `id` and `scope` are
# rejected with 422: the secret and the identity are never client-supplied.

type: object
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: Label identifying the key holder (duplicates allowed)
    example: whmcs service 17
  client_id:
    type: integer
    minimum: 1
    description: Bind the key to this client's control-panel identity; omit for an admin key
    example: 42
  access:
    type: string
    enum: [full, acme]
    default: full
    description: |
      `acme` limits the key to ACME DNS-01 challenges (`/dns/acme-challenges`, `GET /changes/{id}`, `GET /me`), for
      certbot or acme.sh on other servers (spec 057). It keeps the bound identity: with `client_id` it only uses that
      client's zones.
    example: acme
  zones:
    type: array
    maxItems: 100
    items:
      type: string
      maxLength: 253
    description: Only for `access` `acme`; limits the key to these zones (origins, a final dot is accepted)
    example: [example.com]
