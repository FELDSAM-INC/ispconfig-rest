type: object
required: [action]
additionalProperties: false
properties:
  action: {type: string, enum: [import, export, copy]}
  database_name: {type: string, pattern: '^[a-zA-Z0-9_]{2,64}$', description: 'Required for copy; unprefixed name of a NEW database. Other settings inherit from the source.'}
  dump_base64: {type: string, format: byte, maxLength: 11184812, description: 'Required for import. Strict base64 of SQL or gzip SQL, at most 8 MiB decoded upload and 64 MiB inflated SQL.'}
  confirm: {type: boolean, description: 'Must be true for import; acknowledges existing data can be replaced and failures may partially apply.'}
