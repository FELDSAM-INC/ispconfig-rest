# Request body for PUT /mail/users/{id}/password (mail_user.password column).
type: object
x-db-table: mail_user
required:
  - password
properties:
  password:
    type: string
    format: password
    writeOnly: true
    description: |
      New password for the mail user
      - Must satisfy the installation's password policy for every key type (spec 028): at least
        `min_password_length` characters (8 when not configured) and the strength `min_password_strength`
        (ISPConfig scale 1–5), or — when `mail_password_onlyascii` is enabled — ASCII characters only.
        `GET /me/capabilities` returns the policy as `mail.password_policy`; violations return 422 with the
        ISPConfig message.
      - Stored as a SHA-512 crypt hash (`$6$rounds=5000$...`, legacy CRYPTMAIL)
      - Never returned in API responses
    maxLength: 255
    example: "newSecurePassword123!"
    x-db-field: password

description: |
  ## Mail user password change

  Sets a new password for the mailbox identified by the URL path. Only the
  `password` column is updated (datalog update on `mail_user`).
