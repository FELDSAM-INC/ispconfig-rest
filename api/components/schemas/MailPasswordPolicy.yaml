# Mailbox password policy of the installation (spec 025).
# Derived per request from `sys_ini` [misc] min_password_length / min_password_strength and
# [mail] mail_password_onlyascii with the ISPConfig runtime defaults. Read-only.
type: object
description: |
  Rules a mailbox password must meet on this installation (ISPConfig system settings). Feature 028 enforces them on
  mailbox create and password changes.
additionalProperties: false
required:
  - min_length
  - min_strength
  - ascii_only
properties:
  min_length:
    type: integer
    minimum: 0
    description: Minimum number of characters (8 when the installation has no setting; 0 = no minimum).
    example: 8
  min_strength:
    type: integer
    minimum: 0
    maximum: 5
    description: |
      Minimum strength on the ISPConfig scale: 0 no requirement, 1 weak, 2 fair, 3 good, 4 strong, 5 very strong.
      Strength grows with length and with the number of character classes (lowercase, uppercase, digits, symbols).
    example: 3
  ascii_only:
    type: boolean
    description: Only ASCII characters are accepted (`mail_password_onlyascii`).
    example: false
