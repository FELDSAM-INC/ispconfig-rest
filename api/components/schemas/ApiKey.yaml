# API Key Schema
# API-owned table `api_keys` (not an ISPConfig table; spec 014). `key_hash`
# is intentionally unexposed — the plaintext key is returned only once by the
# create operation (ApiKeyCreated). `scope` and `client_id` are derived from
# the bound sys_user / client rows.

type: object
x-db-table: api_keys
required:
  - id
  - name
  - scope
  - client_id
  - active
  - created_at
  - last_used_at
properties:
  id:
    type: integer
    format: int64
    readOnly: true
    description: Unique identifier of the API key
    example: 17
    x-db-field: id
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: Label identifying the key holder
    example: whmcs service 17
    x-db-field: name
  scope:
    type: string
    readOnly: true
    enum: [admin, reseller, client, unbound]
    description: |
      Authorization scope of the bound identity. `unbound` means the ISPConfig user the key was
      bound to no longer exists (the key fails authentication).
    example: client
  client_id:
    type: integer
    nullable: true
    readOnly: true
    description: Bound ISPConfig client id for client and reseller keys; null for admin and unbound keys
    example: 42
  active:
    type: boolean
    description: False when the key is revoked
    example: true
    x-db-field: active
  created_at:
    type: string
    format: date-time
    readOnly: true
    description: Time the key was created
    x-db-field: created_at
  last_used_at:
    type: string
    format: date-time
    nullable: true
    readOnly: true
    description: Time of the last authenticated request made with the key
    x-db-field: last_used_at
