type: object
required: [id, action, status, created_at]
properties:
  id: {type: string, format: uuid}
  action: {type: string}
  installation: {type: [string, 'null'], pattern: '^[a-f0-9]{32}$', description: Installation the job acted on; null for a website-wide rescan.}
  status: {type: string, enum: [queued, running, completed, failed, recovery_required]}
  configuration_pending: {type: boolean, description: WordPress work finished but Apache protections are still being applied. Poll until false; the worker refreshes the cached security status automatically.}
  created_at: {type: string, format: date-time}
  finished_at: {type: [string, 'null'], format: date-time}
  error: {type: [string, 'null'], description: Safe error code; command output and credentials are never exposed.}
  backup_id: {type: [string, 'null'], format: uuid}
  backup_database_id: {type: [integer, 'null'], minimum: 1, description: Owned database whose existing export operation provides the backup, while it remains available.}
