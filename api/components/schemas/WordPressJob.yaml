type: object
required: [id, action, status, created_at]
properties:
  id: {type: string, format: uuid}
  action: {type: string}
  status: {type: string, enum: [queued, running, completed, failed, recovery_required]}
  created_at: {type: string, format: date-time}
  finished_at: {type: [string, 'null'], format: date-time}
  error: {type: [string, 'null'], description: Safe error code; command output and credentials are never exposed.}
  backup_id: {type: [string, 'null'], format: uuid}
