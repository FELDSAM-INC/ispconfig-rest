# A PHP version an account's websites may use on one of its web servers (spec 021).
# Derived from `server_php` and the server's [web] config; carries no paths or binaries.
type: object
description: |
  A PHP version selectable as `server_php_id` for a website of the account on `server_id` in one of `modes`.
  The entry with `id` 0 is the server's built-in default version.
additionalProperties: false
required:
  - id
  - name
  - server_id
  - modes
  - is_default
properties:
  id:
    type: integer
    format: int64
    minimum: 0
    description: Value for `server_php_id`; 0 is the server's default version.
    example: 5
  name:
    type: string
    description: Display name (`server_php.name`, or the server's `php_default_name` for the default version).
    example: PHP 8.3
  server_id:
    type: integer
    format: int64
    minimum: 1
    description: Web server the version belongs to.
    example: 1
  modes:
    type: array
    description: Allowed PHP modes of the account this version supports.
    items:
      type: string
      enum:
        - php-fpm
        - fast-cgi
    example:
      - php-fpm
      - fast-cgi
  is_default:
    type: boolean
    description: True only for the default version (`id` 0).
    example: false
