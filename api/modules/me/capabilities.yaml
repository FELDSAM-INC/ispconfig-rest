# Me — website (spec 021) and mail (spec 025) capabilities of the calling key's account.
# Available to every valid API key (not admin-gated). Read-only.

/me/capabilities:
  get:
    tags:
      - Me
    summary: Website and mail capabilities of the account
    description: |
      Returns what the account's own key may do with websites: the plan's website options, the allowed PHP modes and
      the mode a new website gets, and whether the account is locked or canceled. The values are the rules the
      website endpoints enforce for client and reseller keys, so a panel can offer only choices that are accepted.

      `mail` (spec 025) describes the mailbox options: whether autoresponders and mail filters can be changed, that
      custom filter scripts are administrator-only, whether a spam filter level can be chosen, whether DKIM is
      available on the account's mail servers, whether mailboxes use a custom login name, and the mailbox password
      policy.

      `sites` (spec 035) describes the hosting options: the name prefixes new databases, database users, FTP, SSH and
      WebDAV accounts of this account receive, the plan's database quota cap and remote-access permission, whether
      SSH access is available and with which isolation modes, and which kinds of scheduled task the account may
      create with which shortest interval.

      - Client keys get their own account; `client_id` may only be their own client id (any other → 404).
      - Reseller keys get their own account, or one of their clients by `client_id` (that client's own view; any
        other → 404).
      - Admin keys must pass `client_id` (422 when missing, 404 when unknown).

      Other query parameters → 400. Nothing is written.
    parameters:
      - name: client_id
        in: query
        required: false
        description: Target client (required for admin keys).
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Website and mail capabilities
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AccountCapabilities.yaml'
            example:
              client_id: 42
              account_type: client
              locked: false
              canceled: false
              web:
                ssl: true
                ssl_letsencrypt: true
                wildcard: false
                cgi: false
                ssi: false
                perl: false
                ruby: false
                python: false
                error_documents: false
                directive_snippets: false
                suexec_forced: true
                backup: true
                advanced_options: false
                php_modes:
                  - 'no'
                  - php-fpm
                php_default_mode: php-fpm
              mail:
                autoresponder: true
                mail_filters: true
                custom_rules: false
                spamfilter_policy: true
                dkim: true
                custom_login: false
                password_policy:
                  min_length: 8
                  min_strength: 3
                  ascii_only: false
              sites:
                prefixes:
                  database: c42_
                  database_user: c42_
                  ftp_user: webhostingcz_
                  shell_user: webhostingcz_
                  webdav_user: webhostingcz_
                databases:
                  quota_limit_mb: 2048
                  remote_access: true
                shell:
                  available: true
                  chroot_options:
                    - 'no'
                    - jailkit
                cron:
                  types:
                    - url
                    - chrooted
                  min_interval_minutes: 5
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'
