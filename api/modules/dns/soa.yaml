# DNS SOA (Start of Authority) endpoints
/dns/soa:
  get:
    tags:
      - DNS
    summary: List all DNS zones
    description: |
      Returns a paginated list of DNS zones.

      ### Filtering
      Results can be filtered with the declared query parameters (plain
      equality). The `origin` filter additionally supports `*` as a wildcard
      (e.g. `origin=exa*`).

      ### Sorting & Pagination
      Use the shared `sort`, `order` (asc/desc, default asc), `limit`
      (default 25, max 100) and `offset` parameters.
    parameters:
      - $ref: '../../components/parameters/limit.yaml'
      - $ref: '../../components/parameters/offset.yaml'
      - $ref: '../../components/parameters/sort.yaml'
      - $ref: '../../components/parameters/order.yaml'
      - name: origin
        in: query
        description: Filter by zone origin (supports `*` as wildcard)
        schema:
          type: string
      - name: active
        in: query
        description: Filter by active status
        schema:
          type: boolean
      - name: client_id
        in: query
        description: Filter by owning client (resolved through the client's sys_group).
        required: false
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: A list of DNS zones
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/DnsSoa.yaml'
                meta:
                  $ref: '../../components/schemas/Meta.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

  post:
    tags:
      - DNS
    summary: Create a new DNS zone
    description: |
      Creates a new DNS zone with the specified configuration.

      The write is journaled to ISPConfig's `sys_datalog` and applied
      asynchronously by the DNS server. The SOA `serial` is generated
      server-side.

      ### Server selection
      - Admin keys: `server_id` is required and must reference a DNS server
      - Client and reseller keys: `server_id` may be omitted; the first DNS
        server assigned to the account is used
      - A `server_id` that is not assigned to the account (including
        nonexistent servers) returns 422 on `server_id` with
        `The selected server is not available for this account.`
      - When no DNS server is assigned to the account, 422 on `server_id`
        with `No DNS server is assigned to this account.`

      ### Administrator-only fields
      - `update_acl` (dynamic update ACL) can only be set with an administrator
        key; client and reseller keys that change it get 422 with
        `error_types.update_acl` = `feature-not-allowed`.
      - Renaming a zone (`origin`) needs an administrator or reseller key; a
        client key that changes it gets 422 with `error_types.origin` =
        `feature-not-allowed`.
      - Re-sending the stored value of either field is accepted.
      - `xfer`, `also_notify` and `dnssec_algo` stay writable for every key
        (the legacy form shows them to all user types).
      - `dnssec_wanted` can only be switched on where ISPConfig can sign: when
        the zone's DNS server has mirrors, the ISPConfig panel hides DNSSEC
        entirely and the API refuses the change with 422 and
        `error_types.dnssec_wanted` = `feature-not-allowed`. Switching DNSSEC
        off, and re-sending the stored value, are always accepted. Read the
        state and the DS records for the registrar with
        `GET /dns/soa/{id}/dnssec`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/DnsSoa.yaml'
    responses:
      '201':
        description: DNS zone created successfully
        headers:
          X-Change-Set-Id:
            $ref: '../../components/headers/ChangeSetId.yaml'
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/DnsSoa.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

/dns/soa/{id}:
  get:
    tags:
      - DNS
    summary: Get DNS zone by ID
    description: Returns a single DNS zone by its ID
    parameters:
      - name: id
        in: path
        description: DNS zone ID
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: DNS zone details
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/DnsSoa.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

  put:
    tags:
      - DNS
    summary: Update DNS zone
    description: |
      Updates an existing DNS zone configuration.

      ### Partial Updates
      Only include the fields you want to update. Omitted fields will remain unchanged.

      The SOA `serial` is bumped automatically on every successful update
      (legacy parity); client-supplied serials are ignored.

      ### Server selection
      - Client and reseller keys cannot move the zone: re-sending the current
        `server_id` is accepted, any other value returns 422 with
        `The server cannot be changed after creation.`
      - Admin keys may change `server_id` to another DNS server

      ### Administrator-only fields
      - `update_acl` (dynamic update ACL) can only be set with an administrator
        key; client and reseller keys that change it get 422 with
        `error_types.update_acl` = `feature-not-allowed`.
      - Renaming a zone (`origin`) needs an administrator or reseller key; a
        client key that changes it gets 422 with `error_types.origin` =
        `feature-not-allowed`.
      - Re-sending the stored value of either field is accepted.
      - `xfer`, `also_notify` and `dnssec_algo` stay writable for every key
        (the legacy form shows them to all user types).
      - `dnssec_wanted` can only be switched on where ISPConfig can sign: when
        the zone's DNS server has mirrors, the ISPConfig panel hides DNSSEC
        entirely and the API refuses the change with 422 and
        `error_types.dnssec_wanted` = `feature-not-allowed`. Switching DNSSEC
        off, and re-sending the stored value, are always accepted. Read the
        state and the DS records for the registrar with
        `GET /dns/soa/{id}/dnssec`.
    parameters:
      - name: id
        in: path
        description: DNS zone ID
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/DnsSoa.yaml'
    responses:
      '200':
        description: DNS zone updated successfully
        headers:
          X-Change-Set-Id:
            $ref: '../../components/headers/ChangeSetId.yaml'
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/DnsSoa.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

  delete:
    tags:
      - DNS
    summary: Delete DNS zone
    description: |
      Deletes a DNS zone and everything in it (journaled to `sys_datalog`).

      As in the ISPConfig panel (`dns_soa_del.php`, spec 034) the zone is first
      journaled as inactive, then every resource record of the zone is deleted,
      then the zone itself. All entries share one `X-Change-Set-Id` and the
      whole deletion is one transaction — a failure leaves the zone untouched.
    parameters:
      - name: id
        in: path
        description: DNS zone ID
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: DNS zone deleted successfully
        headers:
          X-Change-Set-Id:
            $ref: '../../components/headers/ChangeSetId.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

/dns/soa/from-template:
  post:
    tags:
      - DNS
    summary: Create a DNS zone from a template (zone wizard)
    description: |
      Creates a DNS zone and its records from a zone template — the ISPConfig DNS wizard
      (`dns_wizard.php`, spec 029).

      The template's placeholders are replaced with the submitted values, the zone is written inactive, every record
      of the template is created, and the zone is activated. All entries share one `X-Change-Set-Id` and the whole
      creation is one transaction, so a refusal or failure leaves no zone and no records behind.

      Every placeholder the template declares in `fields` (see `GET /dns/zone-templates`) must be supplied; a value
      or flag the template does not declare is refused. `dkim` adds the published DKIM record of the domain's mail
      domain when the key can read one, and is a no-op otherwise. `dnssec` creates the zone with signing requested.

      The account's DNS zone limit (`limit_dns_zone`) and DNS record limit (`limit_dns_record`) are both enforced
      before anything is written, the whole set of template records counted at once — unlike the ISPConfig wizard,
      which checks only the zone limit.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/DnsZoneFromTemplate.yaml'
    responses:
      '201':
        description: DNS zone and its records created successfully
        headers:
          X-Change-Set-Id:
            $ref: '../../components/headers/ChangeSetId.yaml'
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/DnsSoa.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'

/dns/soa/{id}/dnssec:
  get:
    tags:
      - DNS
    summary: Get DNSSEC state with the DS records for the registrar
    description: |
      Returns the DNSSEC state of a zone together with the DS records the domain's registrar needs and the DNSKEY
      records the zone publishes (spec 032).

      ISPConfig's DNS server generates the keys and signs the zone, then writes its notes into the zone row; this
      endpoint parses them into data. `state` is `off` when signing was not requested, `pending` while the server
      has not signed yet, `signed` once it has, and `unavailable` when the zone's DNS server is mirrored —
      ISPConfig signs only on the master, so the ISPConfig panel hides DNSSEC there as well.

      Switching signing on and off stays `PUT /dns/soa/{id}` with `dnssec_wanted`. Switching off keeps the keys
      ISPConfig generated, so the DS record stays valid if signing is switched on again.

      Readable by every key that can read the zone (no plan gate). Read-only: no `X-Change-Set-Id`. Private keys,
      file paths and server command output are never returned.
    parameters:
      - name: id
        in: path
        description: DNS zone ID
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: DNSSEC state of the zone
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/DnsSoaDnssec.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '500':
        $ref: '../../components/responses/InternalServerError.yaml'
