# Website backup endpoints (feature 018) — sub-resources of a vhost web domain.
# Backups, restores, downloads and deletions are ISPConfig remote actions (sys_remoteaction), processed
# asynchronously by the server that stores the backup; only the backup settings are written through the datalog.
/sites/web-domains/{id}/backups:
  get:
    tags:
      - Web Backups
    summary: List website backups
    description: |
      Backups of the website's files and of its databases, newest first. Only vhost websites have
      backups (404 for subdomains and alias domains). Client and reseller keys need `limit_backup`
      enabled on their client (403 otherwise).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '../../components/parameters/limit.yaml'
      - $ref: '../../components/parameters/offset.yaml'
      - name: sort
        in: query
        description: Sort field
        schema:
          type: string
          enum: [created_at, id]
          default: created_at
      - name: order
        in: query
        description: Sort order
        schema:
          type: string
          enum: [asc, desc]
          default: desc
      - name: type
        in: query
        description: Only backups of this type
        schema:
          type: string
          enum: [web, mysql, mongodb]
      - name: job
        in: query
        description: Only manual (on-demand) or automatic (scheduled) backups
        schema:
          type: string
          enum: [manual, auto]
    responses:
      '200':
        description: Backups of the website
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/WebBackup.yaml'
                meta:
                  $ref: '../../components/schemas/Meta.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'

  post:
    tags:
      - Web Backups
    summary: Start an on-demand backup
    description: |
      Queues a manual backup of the website files (`web`, one job on the website's server) or of the
      website's MySQL databases (`mysql`, one job per database server). Requires update permission on
      the website.

      A manual backup job can end in state `ok` without producing a backup (ISPConfig reports no
      result for manual backups); check the backup list for the new `manual` backup.

      Returns 409 when a backup of this type is already pending for the website, or when backups are
      not configured on a target server. Remote actions write no datalog entry, so no
      `X-Change-Set-Id` header is returned.

      Client and reseller keys receive 403 while the website's client is locked; admin keys are not
      restricted (owner-delegated decision 2026-09-15).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/WebBackupCreate.yaml'
    responses:
      '201':
        description: Queued backup jobs
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/WebBackupJob.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'

/sites/web-domains/{id}/backups/{backup_id}:
  get:
    tags:
      - Web Backups
    summary: Show a backup
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - name: backup_id
        in: path
        description: ID of the backup (`web_backup.backup_id`)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: The backup
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/WebBackup.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'

  delete:
    tags:
      - Web Backups
    summary: Delete a backup
    description: |
      Queues deletion of the backup on the server that stores it. The backup disappears from the list
      once the server has removed it; the finished delete job is no longer listed then. Requires update
      permission on the website. Returns 409 when a deletion of this backup is already pending or
      backups are not configured on the server. No `X-Change-Set-Id` header (remote action).

      Client and reseller keys receive 403 while the website's client is locked; admin keys are not
      restricted (owner-delegated decision 2026-09-15).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - name: backup_id
        in: path
        description: ID of the backup (`web_backup.backup_id`)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Deletion queued
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'

/sites/web-domains/{id}/backups/{backup_id}/restore:
  post:
    tags:
      - Web Backups
    summary: Restore a backup
    description: |
      Queues a restore on the server that stores the backup. **Destructive**: restoring website files
      replaces the current files with the backup and removes files created after the backup (except
      `backup`, `log`, `ssl` and `tmp`); restoring a database overwrites its tables. Requires update
      permission on the website. Returns 409 when a restore of this backup is already pending or
      backups are not configured on the server. No `X-Change-Set-Id` header (remote action).

      Client and reseller keys receive 403 while the website's client is locked; admin keys are not
      restricted (owner-delegated decision 2026-09-15).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - name: backup_id
        in: path
        description: ID of the backup (`web_backup.backup_id`)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '201':
        description: Queued restore job
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/WebBackupJob.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'

/sites/web-domains/{id}/backups/{backup_id}/download:
  post:
    tags:
      - Web Backups
    summary: Prepare a backup for download
    description: |
      Queues a copy of the backup into the website's `backup` folder, reachable with the website's
      FTP/SSH users and removed by the server after 3 days. Once delivered, the copy can also be fetched
      with `GET /sites/web-domains/{id}/backups/{backup_id}/download` where the installation allows it
      (see that operation and the backup's `download` object). Only for backups
      stored on the website's server (422 otherwise). Requires read permission on the website. When
      the job has finished, the job's `download` object tells where the file is. No `X-Change-Set-Id`
      header (remote action).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - name: backup_id
        in: path
        description: ID of the backup (`web_backup.backup_id`)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '201':
        description: Queued download job
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/WebBackupJob.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'

  get:
    tags:
      - Web Backups
    summary: Download a prepared backup copy
    description: |
      Streams the copy of the backup that `POST` on this path delivers into the website's `backup` folder.

      ISPConfig itself offers no HTTP download; this API adds one. It works wherever the API process can read
      that copy, which is the normal case: ISPConfig adds the web server user to every client group, so a copy
      owned by the website's system user and group is readable. Where that does not hold — hardened permissions,
      a different runtime user, or a backup stored on another server — the endpoint answers 409
      `download-not-readable` and the file must be fetched with the website's FTP or SSH access. Check the
      backup's `download` object (`state` and `http`) before offering a download: `http` is a property of the
      installation, not a transient error.

      Reads only — nothing is queued, journaled or modified, and no file system path is ever disclosed.
      `HEAD` returns the same headers without a body, so a size can be shown before downloading.
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - name: backup_id
        in: path
        description: ID of the backup (`web_backup.backup_id`)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: |
          The archive. `Content-Disposition` carries the archive's file name, `Content-Length` its size, and
          `Cache-Control: private, no-store` keeps it out of shared caches.
        headers:
          Content-Disposition:
            description: 'attachment; filename="<archive name>"'
            schema:
              type: string
          Content-Length:
            description: Size of the archive in bytes
            schema:
              type: integer
              format: int64
          Cache-Control:
            description: Always `private, no-store`
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        description: |
          The client's plan does not include backups (`limit_backup`); problem type `feature-not-allowed`.
        content:
          application/problem+json:
            schema:
              $ref: '../../components/schemas/Problem.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        description: |
          Either no copy is available (`download-not-prepared`: none prepared, or the prepared one is past
          its three-day retention) or a copy exists but this API cannot read it
          (`download-not-readable`: stock permissions, or the backup is stored on another server). The two
          are distinguished by the problem `type`; neither detail names a path.
        content:
          application/problem+json:
            schema:
              $ref: '../../components/schemas/Problem.yaml'
            example:
              type: https://github.com/FELDSAM-INC/ispconfig-rest/blob/main/docs/problems.md#download-not-readable
              title: Conflict
              status: 409
              detail: This installation delivers backup copies to the website's backup folder; fetch it with the website's FTP or SSH access.
  head:
    tags:
      - Web Backups
    summary: Headers of a prepared backup copy
    description: |
      The same answer as `GET` on this path, without a body: the headers tell a consumer the archive's name
      and size, and the same 403/404/409 refusals apply.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: backup_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Headers only (no body)
        headers:
          Content-Disposition:
            schema:
              type: string
          Content-Length:
            schema:
              type: integer
              format: int64
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '409':
        $ref: '../../components/responses/Conflict.yaml'

/sites/web-domains/{id}/backup-jobs:
  get:
    tags:
      - Web Backups
    summary: List backup jobs of a website
    description: |
      Queued and finished backup actions of the website, newest first. `state` stays `pending` until
      the server processes the job (usually within a minute).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '../../components/parameters/limit.yaml'
      - $ref: '../../components/parameters/offset.yaml'
      - name: sort
        in: query
        description: Sort field
        schema:
          type: string
          enum: [created_at, id]
          default: created_at
      - name: order
        in: query
        description: Sort order
        schema:
          type: string
          enum: [asc, desc]
          default: desc
      - name: state
        in: query
        description: Only jobs in this state
        schema:
          type: string
          enum: [pending, ok, warning, error]
      - name: action
        in: query
        description: Only jobs of this action
        schema:
          type: string
          enum: [backup, restore, download, delete]
    responses:
      '200':
        description: Jobs of the website
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/WebBackupJob.yaml'
                meta:
                  $ref: '../../components/schemas/Meta.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'

/sites/web-domains/{id}/backup-jobs/{job_id}:
  get:
    tags:
      - Web Backups
    summary: Show a backup job
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
      - name: job_id
        in: path
        description: ID of the job (`sys_remoteaction.action_id`)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: The job
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/WebBackupJob.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'

/sites/web-domains/{id}/backup-settings:
  get:
    tags:
      - Web Backups
    summary: Read backup settings
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Backup settings of the website
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/WebBackupSettings.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'

  put:
    tags:
      - Web Backups
    summary: Update backup settings
    description: |
      Partial update of the website's backup schedule and options, written through the datalog
      (`web_domain` update). Requires update permission on the website. Enabling encryption requires a
      stored or supplied password (422 otherwise). `backup_password` is write-only.

      Client and reseller keys receive 403 while the website's client is locked; admin keys are not
      restricted (owner-delegated decision 2026-09-15).
    parameters:
      - name: id
        in: path
        description: ID of the web domain (vhost website)
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/WebBackupSettingsUpdate.yaml'
    responses:
      '200':
        description: Updated settings
        headers:
          X-Change-Set-Id:
            $ref: '../../components/headers/ChangeSetId.yaml'
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/WebBackupSettings.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '403':
        $ref: '../../components/responses/Forbidden.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'
