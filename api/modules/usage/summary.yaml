# Usage summary endpoint (read-only, spec 017)

/usage/summary:
  get:
    tags:
      - Usage
    summary: Client plan usage summary
    description: |
      Disk, mail storage, database size and this month's web traffic of one client against its plan limits,
      plus resource counts (websites, mailboxes, databases, …) against the client's limits, counted with the
      same rules that enforce them (spec 012), including catch-all addresses, mail alias domains, mail filter
      rules and fetchmail accounts (spec 025), DNS records (spec 030) and database users (spec 035).

      - Client keys get their own client; `client_id` may only be their own client id (any other → 404).
      - Reseller keys get their own client, or one of their clients by `client_id` (any other → 404).
      - Admin keys must pass `client_id` (422 when missing, 404 when unknown).

      Collector-based values are `null` when the collector data is missing, stale (older than 30 minutes for
      disk and databases, 60 minutes for mail storage) or corrupt. `web_traffic_this_month` counts only active
      websites. Calendar periods use the API timezone (`period.timezone`). All sizes are bytes.

      `freshness` (spec 043) explains those figures: per collector-backed metric it reports how often the
      collector runs (`interval_seconds`), the age at which this API stops trusting the data
      (`stale_after_seconds`), when it was last collected (`measured_at`) and when the next run is due
      (`next_expected_at`). `measured_at` is reported **even when the value itself has aged out**, which is how
      a consumer tells "measured three hours ago" from "never measured": a metric that was never collected has
      both timestamps `null` while the intervals stay present.

      Deciding whether a value is outdated: `measured_at` null means never measured; otherwise the value is
      current while `now - measured_at` is at most `stale_after_seconds`, the same threshold this API applies
      when it reports the metric as `null`. An unknown value must be shown as "not measured yet" and never as
      `0` — a missing measurement is not a measurement of zero. `web_traffic_this_month` has no freshness entry
      because it is summed from daily traffic counters rather than produced by a collector.
    parameters:
      - name: client_id
        in: query
        required: false
        description: Target client (required for admin keys).
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Usage summary
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/UsageSummary.yaml'
      '400':
        $ref: '../../components/responses/BadRequest.yaml'
      '401':
        $ref: '../../components/responses/Unauthorized.yaml'
      '404':
        $ref: '../../components/responses/NotFound.yaml'
      '422':
        $ref: '../../components/responses/UnprocessableEntity.yaml'
