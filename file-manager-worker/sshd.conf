# Dedicated virtual identities; the normal website/SSH accounts are unaffected.
Match Group ispcp-files
    ChrootDirectory /var/lib/ispcp-files/jails/%u
    ForceCommand internal-sftp -d /web -u 0022
    AuthorizedKeysFile /etc/ispcp-files/keys/%u
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
Match all
