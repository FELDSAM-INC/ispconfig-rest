regexes = ['''\Akey = 'mdsswUyr3DPW132mOi8V9xESWE8jTo0dxCjjnopKl\+GqJxpVXckHAeF\+KkxLbxILfDLUT0rAK9iUzy1L53eKGQ=='\z''']

[[allowlists]]
