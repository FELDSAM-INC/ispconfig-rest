[[allowlists]]
description = "Reviewed synthetic fixture or truncated PEM example"
targetRules = ["ispconfig-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)README\.md$''']
regexes = ['''\Aisp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\z''']

[[rules]]
id = "ispconfig-api-key"
description = "ISPConfig REST API credential"
regex = '''\bisp_[A-Za-z0-9]{40}\b'''
keywords = ["isp_"]
