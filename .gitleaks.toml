regexTarget = "match"
paths = ['''(^|/)tests/Feature/DnsAcmeChallengeApiTest\.php$''']
regexes = ['''\ATOKEN = '9ihDbjYfTExAYeDs4DBUeuTo18KBzwvTEjUnSwd32-c'\z''']

[[allowlists]]
description = "Reviewed synthetic fixture or truncated PEM example"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
